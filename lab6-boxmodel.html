<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Box Model Lab</title>
<style>

.box {
width: 350px;
height: 175px;
border: 5px solid blue;
padding: 20px;
margin: 20px;
background-color: LightGray;
box-sizing: border-box;
}
/* With only one box, it is difficult to visually tell the difference between the presence and absence of the box-sizing property. But, with two boxes it is clear that even while keeping the width and height constant, the border-box value makes the boxes considerably smaller by including the size of padding and borders in the size of the box on the page. */


</style>
</head>
<body>
<h1>CSS Box Model Lab</h1>
<div class="box">
<p>This is a demonstration of the CSS Box Model.</p>
</div>

<div class="box">
<p> This is a secondary box used for experimenting with the CSS Box Model. </p>
</div>
</body>
</html>
